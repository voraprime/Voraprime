<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voraprime — Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
    body { margin: 0; font-family: 'Outfit', sans-serif; background-color: #0a0a0a; color: white; background-image: linear-gradient(to right, rgba(255,255,255,.015) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.015) 1px, transparent 1px); background-size: 40px 40px; overflow-x: hidden; }
    .glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; pointer-events: none; z-index: -1; opacity: 0.15; filter: blur(60px); }
    .glow-orange { top: -100px; right: -100px; background: radial-gradient(circle, #f97316 0%, transparent 70%); }
    .glass-card { background: #111111; border: 1px solid #27272a; transition: all 0.2s ease; }
    .glass-card:hover { border-color: rgba(249,115,22,0.3); background: #171717; transform: translateY(-2px); }
  </style>
</head>
<body class="min-h-screen pb-10 flex flex-col">
  <div class="glow glow-orange"></div>
  <header class="sticky top-0 z-40 border-b border-white/[.05] bg-[#0a0a0a]/80 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center bg-gradient-to-br from-orange-500 to-red-600 shadow-md"><i class="fa-solid fa-bolt text-white text-sm"></i></div>
        <div>
          <div class="text-[17px] font-black tracking-[.1em] uppercase leading-tight">Voraprime</div>
          <div class="text-[8px] text-orange-500 tracking-[.25em] uppercase font-bold">Lobby / Sảnh</div>
        </div>
      </div>
      <button onclick="logout()" class="w-9 h-9 rounded-xl border border-zinc-800 bg-[#111111] text-rose-500 hover:bg-zinc-800 transition"><i class="fa-solid fa-power-off text-sm"></i></button>
    </div>
  </header>
  <main class="flex-1 max-w-3xl mx-auto w-full px-5 pt-8">
    <div class="mb-8">
      <h1 class="text-2xl font-black mb-1">Xin chào, <span id="user-name" class="text-orange-500">Người dùng</span>!</h1>
      <p class="text-[13px] text-zinc-500 font-medium">Chọn một công cụ tự động hóa để bắt đầu.</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <a href="treovoice.html" class="glass-card rounded-3xl p-6 relative overflow-hidden group">
        <div class="w-12 h-12 rounded-2xl bg-orange-500/10 text-orange-500 flex items-center justify-center text-xl mb-4 border border-orange-500/20"><i class="fa-solid fa-microphone-lines"></i></div>
        <h3 class="text-lg font-bold text-white mb-2">Treo Voice 24/7</h3>
        <p class="text-xs text-zinc-400 font-medium leading-relaxed mb-4">Quản lý account treo voice Discord 24/7, tuỳ chỉnh trạng thái.</p>
        <span class="text-[10px] font-bold text-orange-400 flex items-center gap-1"><i class="fa-solid fa-circle-play"></i> TRUY CẬP</span>
      </a>
    </div>
  </main>
  <script>
    const token = localStorage.getItem('hub_token'); const username = localStorage.getItem('hub_user');
    if (!token) window.location.href = 'login.html'; if (username) document.getElementById('user-name').innerText = username;
    function logout() { localStorage.clear(); window.location.href = 'login.html'; }
  </script>
</body>
</html>
